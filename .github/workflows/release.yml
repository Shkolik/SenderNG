name: Release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Formal release (no date suffix, marked latest)'
        type: boolean
        default: false
      notes:
        description: 'Optional release notes (known issues, upgrade summary, etc.)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
      date: ${{ steps.gate.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        shell: pwsh
        run: |
          $gateParams = @{
            SkipChangeCheck = ('${{ github.event_name }}' -eq 'workflow_dispatch')
            Stable          = ('${{ inputs.stable }}' -eq 'true')
          }
          & ./tools/release-gate.ps1 @gateParams

  build-win64:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build win64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform win64 --date ${{ needs.gate.outputs.date }} ${{ inputs.stable && '--stable' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-win64
          path: output/win64/*.zip
          if-no-files-found: error

  build-linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build linux-x64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform linux --date ${{ needs.gate.outputs.date }} ${{ inputs.stable && '--stable' || '' }}

      - name: Build linux-arm64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform linux-arm64 --skip-tests --date ${{ needs.gate.outputs.date }} ${{ inputs.stable && '--stable' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: output/linux/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: output/linux-arm64/*.zip
          if-no-files-found: error

  publish:
    needs: [gate, build-win64, build-linux]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*

      - name: Collect assets and write merged checksums
        run: |
          mkdir -p release-assets
          mv release-win64/*.zip release-linux/*.zip release-linux-arm64/*.zip release-assets/
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          echo "Assets: $(ls *.zip | wc -l) zips"

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          STABLE: ${{ inputs.stable }}
          EVENT: ${{ github.event_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/$TAG" || true
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          if [ "$STABLE" = "true" ]; then
            # A stable release summarizes everything since the last STABLE release. Prereleases
            # count as "the previous release" for --generate-notes (v0.1.0 was generated against
            # v0.1.0-20261011), so without --notes-start-tag a stable published after a weekly
            # would only cover that week and the feature work behind it would never appear.
            PREV_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName // ""' 2>/dev/null || true)
            if [ -n "$PREV_STABLE" ]; then
              gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --title "$TAG" --generate-notes --notes-start-tag "$PREV_STABLE"
            else
              gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --title "$TAG" --generate-notes
            fi
          else
            gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --title "$TAG" --generate-notes --prerelease
          fi

      - name: Prepend release header
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          STABLE: ${{ inputs.stable }}
          NOTES: ${{ inputs.notes }}
        run: |
          HEADER_FILE=$(mktemp)
          if [ "$STABLE" = "true" ]; then
            if [ -n "$NOTES" ]; then
              printf '%s\n\n' "$NOTES" > "$HEADER_FILE"
            else
              : > "$HEADER_FILE"
            fi
          else
            cat > "$HEADER_FILE" << 'EOF'
          ## ⚠️ Weekly Preview

          This is an automated weekly preview build. It may contain unfinished
          features, regressions, or bugs still under active development.
          **Use at your own risk.**

          For a tested build, use the
          [latest stable release](https://github.com/Shkolik/SenderNG/releases/latest).

          EOF
          fi
          cat >> "$HEADER_FILE" << 'EOF'
          ### Assets

          - **SenderNG** — core application (win64, linux-x64, linux-arm64). Barebone functions included, no plugins.
          - **Plugins** — optional plugin packages, one zip per plugin,
          matching the platform suffix (e.g. a `linux-x64` plugin goes with
          the `linux-x64` core only)
            * SenderNG-plugin-hpgl - HPGL->Gcode converter
            * SenderNG-plugin-excellon - Excellon->Gcode converter
            * SenderNG-plugin-plotter - 2D/Isometric Gcode viewer/plotter (good for a weak hardware)
            * SenderNG-plugin-plotter-gl - 3D Gcode viewer/plotter (requires OpenGL 3.1+)
            * SenderNG-plugin-probing - Probing module
            * SenderNG-plugin-heightmap-viewer - 3D height-map viewer (requires OpenGL 3.1+)
          - **SHA256SUMS.txt** — SHA-256 checksums for all zips above
          ---

          EOF
          CURRENT_BODY=$(gh release view "$TAG" --json body -q .body)
          COMBINED=$(cat "$HEADER_FILE"; printf '%s\n' "$CURRENT_BODY")
          printf '%s\n' "$COMBINED" > /tmp/release-body.md
          gh release edit "$TAG" --notes-file /tmp/release-body.md
          rm -f "$HEADER_FILE" /tmp/release-body.md
