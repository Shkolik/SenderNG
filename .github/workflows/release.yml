name: Release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      stable:
        description: 'Formal release (no date suffix, marked latest)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        shell: pwsh
        run: |
          $gateArgs = @()
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $gateArgs += '-SkipChangeCheck' }
          if ('${{ inputs.stable }}' -eq 'true') { $gateArgs += '-Stable' }
          & ./tools/release-gate.ps1 @gateArgs

  build-win64:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: windows-latest
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/helix-toolkit/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PAT }}

      - name: Build win64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform win64 --version ${{ needs.gate.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-win64
          path: output/win64/*.zip
          if-no-files-found: error

  build-linux:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/helix-toolkit/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PAT }}

      - name: Build linux-x64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform linux --version ${{ needs.gate.outputs.version }}

      - name: Build linux-arm64 release
        run: dotnet run --project tools/ReleaseManager -- --include-plugins --platform linux-arm64 --skip-tests --version ${{ needs.gate.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: output/linux/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: output/linux-arm64/*.zip
          if-no-files-found: error

  publish:
    needs: [gate, build-win64, build-linux]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*

      - name: Collect assets and write merged checksums
        run: |
          mkdir assets
          mv release-win64/*.zip release-linux/*.zip release-linux-arm64/*.zip assets/
          cd assets
          sha256sum *.zip > SHA256SUMS.txt
          echo "Assets: $(ls *.zip | wc -l) zips"

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          STABLE: ${{ inputs.stable }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/$TAG" || true
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          if [ "$STABLE" = "true" ]; then
            gh release create "$TAG" assets/*.zip assets/SHA256SUMS.txt --title "$TAG" --generate-notes
          else
            gh release create "$TAG" assets/*.zip assets/SHA256SUMS.txt --title "$TAG" --generate-notes --prerelease
          fi
