name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      MSBUILDDEBUGPATH: ${{ github.workspace }}/msbuild-diag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/helix-toolkit/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PAT }}

      - name: Build
        run: dotnet build SenderNG.sln -c Release --nologo -t:Rebuild -warnaserror

      - name: Test
        run: dotnet test SenderNG.sln -c Release --filter "Category!=Hardware&Category!=GPU&Category!=Timing" --logger trx

      - name: Collect MSBuild node diagnostics
        # always(), not failure(): the intermittent ubuntu-latest death arrives as
        # "the runner has received a shutdown signal" followed by MSB4166, and a
        # cancelled job skips failure()-conditioned steps — which is exactly how the
        # first occurrence lost its cgroup/OOM evidence. Diagnostics only; this
        # cannot mask a failure or retry anything.
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          mkdir -p msbuild-diag
          cp /tmp/MSBuildTemp*/MSBuild_*.failure.txt msbuild-diag/ 2>/dev/null
          {
            echo "=== date ==="; date -u
            echo "=== free ==="; free -m
            echo "=== cgroup v2 memory.events ==="; cat /sys/fs/cgroup/memory.events 2>/dev/null
            echo "=== cgroup v1 memory.events ==="; cat /sys/fs/cgroup/memory/memory.events 2>/dev/null
            echo "=== dmesg oom ==="; dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill" | tail -20
            echo "=== failure files present ==="; ls -la /tmp/MSBuildTemp*/ 2>/dev/null
            echo "=== failure file contents ==="; cat msbuild-diag/MSBuild_*.failure.txt 2>/dev/null
          } > msbuild-diag/report.txt 2>&1
          cat msbuild-diag/report.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            msbuild-diag/**
