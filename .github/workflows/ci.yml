name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      # The ubuntu-latest deaths were an OOM, not a build-tool defect: an unbounded
      # snapshot-stress writer (in a test since removed) grew a dotnet process to
      # ~15 GB of anonymous RSS, and the kernel reaped whichever process it found --
      # an MSBuild node ("MSB4166: Child node \"2\" exited prematurely") or the runner
      # agent itself ("The operation was canceled.", no artifacts, post-steps never
      # ran). Fixed at the source by capping that writer. MSBUILDDISABLENODEREUSE
      # and the -m:1 below stay as cheap memory
      # hygiene for a 7 GB runner, not as a fix.
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SenderNG.sln -c Release --nologo -t:Rebuild -warnaserror -m:1

      - name: Test
        # --no-build: the Build step above already produced these Release bits, so the
        # test step should not restore and rebuild nine projects while it runs. That was
        # redundant work in the phase where the OOM occurred, and it is a real cut in
        # peak memory on a 7 GB runner.
        run: dotnet test SenderNG.sln -c Release --no-build --filter "Category!=Hardware&Category!=GPU&Category!=Timing" --logger trx -m:1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  # Report-only for now: answers "does GitHub's macOS VM expose a usable
  # OpenGL context to CGL?" with evidence instead of assumption. It must not
  # block anything until the CGL path is proven on runners; promotions
  # criterion is three consecutive weekly releases with the smoke passing
  # (see the macOS release design spec). The job's trx is always uploaded so
  # a red result still leaves the version/renderer strings for triage.
  gl-smoke-macos:
    runs-on: macos-latest
    continue-on-error: true
    env:
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SenderNG.sln -c Release --nologo -t:Rebuild -warnaserror -m:1

      - name: GL smoke
        env:
          SENDERNG_GL_SMOKE: "1"
        run: dotnet test tests/SenderNG.Core.Tests/SenderNG.Core.Tests.csproj -c Release --no-build --filter "Category=GLSmoke" --logger trx -m:1

      - name: GPU suite (report only)
        continue-on-error: true
        run: dotnet test SenderNG.sln -c Release --no-build --filter "Category=GPU" --logger trx -m:1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-gl
          path: '**/TestResults/*.trx'
