name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      MSBUILDDEBUGPATH: ${{ github.workspace }}/msbuild-diag
      # The intermittent ubuntu-latest death is a hard process crash (SIGABRT) inside
      # MSBuild's out-of-proc node plumbing: "Child node \"2\" exited prematurely
      # (MSB4166)" in CI, and locally NodeProviderOutOfProcBase.ConnectToPipeStream with
      # "Fatal error. Internal CLR error. (0x80131506)". That mode writes no
      # MSBuild_*.failure.txt, so msbuild-diag stays empty. -m:1 (below) keeps MSBuild in
      # a single process, so no worker nodes and no named pipes are involved at all.
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/helix-toolkit/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PAT }}

      - name: Build
        run: dotnet build SenderNG.sln -c Release --nologo -t:Rebuild -warnaserror -m:1

      - name: Test
        run: dotnet test SenderNG.sln -c Release --filter "Category!=Hardware&Category!=GPU&Category!=Timing" --logger trx -m:1

      - name: Collect MSBuild node diagnostics
        # always(), not failure(): the ubuntu-latest death is a crash inside MSBuild's
        # node plumbing that cancels the job, and a cancelled job skips
        # failure()-conditioned steps — which is how the first occurrence lost its
        # cgroup/OOM evidence. The crash writes no MSBuild_*.failure.txt (confirmed in
        # WSL: MSBUILDDEBUGPATH set, directory left empty), so expect the memory report
        # and the temp-dir listing to be the useful part. Diagnostics only; this cannot
        # mask a failure or retry anything.
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          mkdir -p msbuild-diag
          cp /tmp/MSBuildTemp*/MSBuild_*.failure.txt msbuild-diag/ 2>/dev/null
          {
            echo "=== date ==="; date -u
            echo "=== free ==="; free -m
            echo "=== cgroup v2 memory.events ==="; cat /sys/fs/cgroup/memory.events 2>/dev/null
            echo "=== cgroup v1 memory.events ==="; cat /sys/fs/cgroup/memory/memory.events 2>/dev/null
            echo "=== dmesg oom ==="; dmesg 2>/dev/null | grep -iE "killed process|out of memory|oom-kill" | tail -20
            echo "=== failure files present ==="; ls -la /tmp/MSBuildTemp*/ 2>/dev/null
            echo "=== failure file contents ==="; cat msbuild-diag/MSBuild_*.failure.txt 2>/dev/null
          } > msbuild-diag/report.txt 2>&1
          cat msbuild-diag/report.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            msbuild-diag/**
